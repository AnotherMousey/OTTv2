services:
  - type: web
    name: ottv2-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    preDeployCommand: DATABASE_URL="$MIGRATION_DATABASE_URL" npm run db:migrate
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
  - type: worker
    name: ottv2-worker
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerCommand: node services/worker/index.cjs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RUNNER_URL
        sync: false
      - key: RUNNER_SECRET
        sync: false
      - key: WORKER_CONCURRENCY
        value: "2"
  - type: web
    name: ottv2-frontend
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: VITE_API_BASE_URL
        sync: false
