services:
  - type: web
    name: ottv2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: MATCH_WORKERS
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
